<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste background image</title>

    <style>

        body{
            background-image: url(img/wallpaper006.jpg);
            
        }
        div.quadrado{
            display: inline-block;
            border-radius: 10px;
            border: 2px solid black;
            background-color: burlywood;
            width: 300px;
            height: 300px;
        }

        div#q1{
            background-color: crimson;
        }
        div#q2{
            background-image: linear-gradient(to bottom, red, yellow);
            
        }

        div#q3{
            background-image: url(img/pattern003.png);
        }

        div#q4{
            background-image: linear-gradient(to bottom, rgb(4, 0, 253), rgb(0, 247, 255));
        }

        div#q5{
            background-image: url(img/wallpaper001.jpg);
        }

        div#q6{
            background-image: url(img/pattern002.png);
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1">

    </div>

    <div class="quadrado" id="q2">

    </div>

    <div class="quadrado" id="q3">

    </div>
    <div class="quadrado" id="q4">

    </div>

    <div class="quadrado" id="q5">

    </div>

    <div class="quadrado" id="q6">

    </div>
</body>
</html>
