<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post"></form>
    <p>
        <label for="in1">número:</label>
        <input type="number" name="n1" id="in1" min="0" max="50" required
        oninput="isoma.innerHTML =Number(in1.value) + Number(in2.value)">
    </p>

    <p>
        <label for="in2">número:</label>
        <input type="number" name="n2" id="in2" min="0" max="50" required
        oninput="isoma.innerHTML =Number(in1.value) + Number(in2.value)">
    </p>

    <p>
        <label for="isoma">Soma:</label>
        <output id="isoma">0</output>
    </p>

    <p>
        <input type="submit" value="enviar pra casa do caraio">
        <input type="reset" value="limpar">
    </p>
</body>
</html>
