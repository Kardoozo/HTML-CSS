<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>primeiro programa...</title>
    <style>
        body{
            background-color: rgb(55, 131, 161);
            color: white;
            font: normal 20pt Arial;
        }
        h1{
            color: rgb(228, 129, 15);
        }
    </style>
</head>

<body>
    <h1> Hello World!</h1>
    <script>
        var nome = prompt('Qual é o seu Nome?')
        document.write(`Olá, <strong>${nome}</strong>! seu nome tem ${nome.length} Letras!<br/>`)
        document.write(`seu nome em Maiúsculo é ${nome.toUpperCase()} e seu nome em Minúsculo é ${nome.toLowerCase()}`)
     
    </script>
</body>
</html>
