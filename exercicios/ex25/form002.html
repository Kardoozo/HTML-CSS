<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 40px;
        }

        .senha{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 40px;
        }

        .usu{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 40px;
        }

        .enviar{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 40px;
            border: 2px solid rgb(7, 131, 233);
            border-radius: 20px;
        }

        .limpar{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 40px;
            border: 2px solid rgb(7, 131, 233);
            border-radius: 20px;
        }

    </style>
</head>
<body>
    <h1>teste formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="off">
    <p><label  for="iusu">Usuário:</label>
        <input class="usu" type="text" name="usuario" id="iusu" required minlength="5" maxlength="15" size="15" placeholder="Nome do Usuário" autocomplete="username">
    </p>
    <p>
        <label for="isen">Senha:</label>
        <input class="senha" type="password" name="senha" id="isen" required minlength="8" maxlength="20" size="15" placeholder="Coloque sua Senha" autocomplete="current-password">
    </p>
    <p>
        <input class="enviar" type="submit" value="Enviar">
        <input class="limpar" type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
