<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>estrangeiro ou brasileiro</title>
</head>
<body>
    <h1>brasileiro ou estrangeiro</h1>
    <input type="text" name="txtpais" id="txtpais" placeholder="Qual é o seu país?">
    <input type="button" value="Verificar" onclick="determinarNacionalidade()">
    <div id="resultado"></div>
    <script>
        function determinarNacionalidade() {
            var txtpais = document. querySelector("input#txtpais")
            var resultado = document. querySelector("div#resultado")
            var pais = txtpais.value
            resultado.innerHTML = `<p>Você é do país <strong>${pais}</strong></p>`

            if (pais == "Brasil" || pais == "brasil"){
                resultado.innerHTML += `<p>Você é <strong>BRASILEIRO</strong></p>`
            }
             else {
                resultado.innerHTML += `<p>Você é <strong>ESTRANGEIRO</strong></p>`
            }
        }
    </script>
        

</body>
</html>
