<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>

    <style>
        #conteiner {
            background-image: url(img/target001.png);
            background-size: 100% 100%;
            position: relative;
            height: 95vh;
            background-color: rgb(0, 255, 85);
            padding: 10px;
        }

        #conteudo{
            background-image: url(img/target001.png);
            background-size: 100% 100%;
            position: absolute;
            height: 200px;
            width: 400px;
            background-color: #0400ff;
            margin: auto;
            left: 50%;
            top: 50%;
            
            /*
            números positivos primeiro é Direita
            números positivos segundo é Baixo


            números Negativos  primeiro é Esquerda
            números Negativos segundo é Cima
            */

            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <section id="conteiner">
        <article id="conteudo">
        
        </article>
    </section>
</body>
</html>
