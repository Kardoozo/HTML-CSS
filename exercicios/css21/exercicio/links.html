<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>link</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: crimson;
            text-decoration: none;
            font-weight: bolder;
            text-transform: uppercase;
            
            
        }
        a:visited{
            color: cadetblue;
        }

        a:hover{
            text-decoration: underline;
            color: blue;
        }
        a:active{
            color: chartreuse;
        }
        h1{
            text-align: center;
        }
        ul{
            text-align: center;
        }
        
        a::before{
            content: '↪';
            font-weight: normal;
            text-decoration: none;
            color: blue;



        }

    </style>



</head>
<body>
    <h1>Personalizando Links</h1>

</html>
